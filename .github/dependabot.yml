version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      ytdlp-group:
        patterns:
          - "@distube/ytdl-core"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@distube/ytdl-core"
        update-types:
          - "major"
